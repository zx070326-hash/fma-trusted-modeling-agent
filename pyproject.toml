[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fma-trusted-kernel"
version = "0.4.0"
description = "A graph-native trustworthy kernel and staged workspace for mathematical modeling"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "cryptography>=42",
  "numpy>=2.0",
  "pydantic>=2.10",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fma-ops = "fma.operator_cli_v70:main"
fma-paper = "fma.v7_1.paper_cli:main"
fma-studio = "fma.studio.__main__:main"

[project.urls]
Repository = "https://github.com/zx070326-hash/fma-trusted-modeling-agent"
Issues = "https://github.com/zx070326-hash/fma-trusted-modeling-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["fma*"]

[tool.setuptools.package-data]
fma = [
  "prompts/*.md",
  "v5/task_template/*",
  "v5/task_template/gates/*",
  "v5/task_template/skills/*/*",
  "v7_1/templates/*.tex",
]
